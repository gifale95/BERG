[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BERG"
dynamic = ["version"]
description = "Brain Encoding Response Generator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}  # Update this to your actual license
maintainers = [
    {name = "Alessandro Gifford", email = "alessandro.gifford@gmail.com"}
]
classifiers = [
    "Programming Language :: Python",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "av",
    "h5py",
    "joblib",
    "nibabel",
    "nilearn",
    "numpy",
    "Pillow",
    "scipy",
    "scikit-learn>=1.3",
    "torch",
    "torchvision",
    "tqdm",
    "pyyaml",
    "torchextractor",
    "ftfy",
    "regex",
    "clip @ git+https://github.com/openai/CLIP.git",
    "yacs==0.1.8",
    "yacs-stubgen==0.3.0",
    "python-dotenv==0.21.1",
    "einops==0.8.0",
    "timm==0.9.2",
    "mosaic-dataset",
    "fnn @ git+https://github.com/cajal/fnn.git",
    "transformers>=4.46.3",
    "huggingface-hub>=0.36.0",
    "x-transformers==1.27.20",
    "uv",
    "tables",
    "eva-decord==0.6.1",
    "safetensors>=0.5.3",
    "himalaya"
]

[project.optional-dependencies]
full = [
    "tribev2 @ git+https://github.com/facebookresearch/tribev2.git",
]
brainscore = [
    "brainscore-vision",
    "brainscore-language",
    "pandas<2.2",
]
test = [
    "pytest>=7",
]
docs = [
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/gifale95/BERG"
Repository = "https://github.com/gifale95/BERG"

[tool.setuptools]
packages = {find = {}}
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "berg._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "heavy: downloads a torchvision/HF backbone (no S3 weights); slower CI tier",
    "weights: requires real BERG weights via BERG_DIR (integration tier only)",
]
# By default, skip the integration tests that need real S3 weights.
addopts = "-m 'not weights'"
