model_id: fmri-mosaic-cnn8_visual
modality: fMRI
training_dataset: MOSAIC (all datasets)
species: Human
stimuli: Images
model_type: CNN8 (8-layer convolutional network)
creator: MOSAIC Team (Lahner et al., 2025)

# General description of the model
description: |
  This encoding model consists of a brain-optimized convolutional neural network (CNN8) trained to predict
  visual cortex fMRI responses across multiple large-scale datasets. The model uses a shared 8-layer convolutional
  core with subject-specific linear factorized readout heads, jointly trained across 93 subjects from 8 datasets.

  **Neural data.** The model was trained on the MOSAIC (Meta-Organized Stimuli And fMRI Imaging data for
  Computational modeling) aggregated dataset, which consists of 430,007 single-trial fMRI–stimulus pairs across
  162,839 unique naturalistic and artificial stimuli from 93 subjects. All data underwent a shared preprocessing
  pipeline (fMRIPrep and GLMsingle) to ensure consistency across datasets. The eight constituent datasets are:
  BOLD5000 (4 subjects), Deeprecon (3 subjects), Generic Object Decoding / GOD (5 subjects),
  Natural Scenes Dataset / NSD (8 subjects), THINGS-fMRI (3 subjects), BOLD Moments Dataset / BMD (10 subjects),
  Natural Object Dataset / NOD (30 subjects), and Human Actions Dataset / HAD (30 subjects).

  **Model architecture.** The CNN8 core consists of eight 2D convolutional blocks (each with 2D convolution,
  batch normalization, and ReLU activation). Convolutional kernel sizes range from 5×5 (blocks 1–2) to 3×3
  (blocks 3–8), with 384 channels throughout (except 3 RGB input channels). Average pooling layers (kernel
  size 2, stride 2) are inserted after blocks 2, 4, and 6, with a final pooling layer (kernel size 2, stride 1)
  after block 8. Each subject has a dedicated linear factorized readout head with spatial and feature weight
  matrices initialized with L2-normalized spatial weights.

  **Preprocessing.** Input images are center-cropped to square along the shorter dimension, resized to 224×224
  pixels, and normalized (mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]). For video stimuli (BMD, HAD),
  a representative frame is extracted per stimulus. fMRI responses are modeled at the single-trial level.

  **Model training partition.** The model was trained on naturalistic stimuli using curated MOSAIC train/validation
  splits designed to prevent stimulus leakage across datasets. Training used the Adam optimizer (initial learning
  rate 1e-4, weight decay 1e-4), ReduceLROnPlateau scheduling, mean squared error loss, and a batch size of 64.
  Training was performed jointly across all subjects using a multi-head architecture.

  **Model testing partition.** Models are evaluated on held-out naturalistic test stimuli and artificial test
  stimuli (e.g., shapes, noise patterns, gratings), with strict control of stimulus overlap across datasets.

  **Noise ceiling.** Vertex-wise noise ceilings were computed from split-half reliability of repeated stimulus
  presentations using single-trial beta estimates. Noise ceilings are reported as percent variance explained
  relative to the estimated signal-to-noise ratio.

  **Output.** The model predicts fMRI responses for 7,831 vertices in visual cortex, corresponding to MMP 1.0
  parcellation sections 1–5 (early visual cortex through higher-level ventral and dorsal visual streams).


metadata: |
  'fmri':
      participant_id         : str         - Subject identifier (e.g., 'sub-01')
      age                    : int         - Subject age
      sex                    : str         - Subject sex
      filenames              : (70850,)    - Stimulus filenames
      alias                  : (70850,)    - Stimulus aliases
      source                 : (70850,)    - Stimulus source datasets
      train_idx              : (69566,)    - Training trial indices
      test_idx               : (1284,)     - Test trial indices
      train_filenames        : (69566,)    - Training stimulus filenames
      test_filenames         : (1284,)     - Test stimulus filenames
      reps                   : (1284,)     - Stimulus repetition counts per subject
      roi_all_vertices       : dict        - ROI masks for all cortical vertices (7831,) (L and R versions available)
          L_V1, L_V2, L_V3, L_V3A, L_V3B, L_V3CD, L_V4, L_V4t, L_V6, L_V6A, L_V7, L_V8,
          L_VMV1, L_VMV2, L_VMV3, L_VVC, L_FFC, L_FST, L_IPS1, L_LO1, L_LO2, L_LO3,
          L_MST, L_MT, L_PH, L_PIT : (7831,) bool - Binary mask for each ROI
          (R_ versions for right hemisphere)
  'encoding_models':
      test_n-avg_noiseceiling_visual_vertices : (7831,) - Max explainable variance per vertex (trial-averaged test set)

# Input stimulus information
input:
  type: "numpy.ndarray"
  shape: [batch_size, 3, height, width]
  description: "The input should be a batch of RGB images."
  constraints:
    - "Image values should be integers in range [0, 255]."
    - "Image dimensions (height, width) should be equal (square)."
    - "Minimum recommended image size: 224×224 pixels."

# Output information
output:
  type: "numpy.ndarray"
  shape: [batch_size, n_vertices]
  description: "The output is a 2D array containing in silico fMRI responses for visual cortex."
  dimensions:
    - name: "batch_size"
      description: "Number of stimuli in the batch."
    - name: "n_vertices"
      description: "Number of visual cortex vertices (up to 7,831, based on ROI/vertex selection)."

# Model parameters and their usage
parameters:
  subject:
    type: str
    required: true
    valid_values: [
      'BOLD5000-01', 'BOLD5000-02', 'BOLD5000-03', 'BOLD5000-04',
      'deeprecon-01', 'deeprecon-02', 'deeprecon-03',
      'GOD-01', 'GOD-02', 'GOD-03', 'GOD-04', 'GOD-05',
      'NSD-01', 'NSD-02', 'NSD-03', 'NSD-04', 'NSD-05', 'NSD-06', 'NSD-07', 'NSD-08',
      'THINGS-01', 'THINGS-02', 'THINGS-03',
      'BMD-01', 'BMD-02', 'BMD-03', 'BMD-04', 'BMD-05', 'BMD-06', 'BMD-07', 'BMD-08', 'BMD-09', 'BMD-10',
      'NOD-01', 'NOD-02', 'NOD-03', 'NOD-04', 'NOD-05', 'NOD-06', 'NOD-07', 'NOD-08', 'NOD-09', 'NOD-10',
      'NOD-11', 'NOD-12', 'NOD-13', 'NOD-14', 'NOD-15', 'NOD-16', 'NOD-17', 'NOD-18', 'NOD-19', 'NOD-20',
      'NOD-21', 'NOD-22', 'NOD-23', 'NOD-24', 'NOD-25', 'NOD-26', 'NOD-27', 'NOD-28', 'NOD-29', 'NOD-30',
      'HAD-01', 'HAD-02', 'HAD-03', 'HAD-04', 'HAD-05', 'HAD-06', 'HAD-07', 'HAD-08', 'HAD-09', 'HAD-10',
      'HAD-11', 'HAD-12', 'HAD-13', 'HAD-14', 'HAD-15', 'HAD-16', 'HAD-17', 'HAD-18', 'HAD-19', 'HAD-20',
      'HAD-21', 'HAD-22', 'HAD-23', 'HAD-24', 'HAD-25', 'HAD-26', 'HAD-27', 'HAD-28', 'HAD-29', 'HAD-30'
    ]
    example: "NSD-01"
    description: "Subject identifier in format DATASET-##, where DATASET is one of the eight constituent datasets and ## is the zero-padded subject number (01-30 depending on dataset)."
    function: "get_encoding_model"

  selection:
    type: dict
    description: |
      Specifies which outputs to include in the model responses.
      Can include specific ROIs and/or vertex indices. If not provided,
      fMRI responses are generated for all visual cortex vertices.
    required: false
    function: get_encoding_model
    properties:
      roi:
        type: list[str]
        description: |
          List of region-of-interest (ROI) labels from visual cortex to include.
          Available ROIs from the Glasser MMP 1.0 atlas (bilateral):
            • Early visual: V1, V2, V3, V3A, V3B, V3CD, V4, V4t, V6, V6A, V7, V8
            • Ventral stream: VMV1, VMV2, VMV3, VVC, FFC, PIT, PH
            • Dorsal stream: IPS1, LO1, LO2, LO3, MST, MT, FST
          Prefix with 'L_' or 'R_' for hemisphere-specific selection.
          If multiple ROIs are listed, their vertices are concatenated.
        valid_values: [
          'L_V1', 'L_V2', 'L_V3', 'L_V3A', 'L_V3B', 'L_V3CD', 'L_V4', 'L_V4t',
          'L_V6', 'L_V6A', 'L_V7', 'L_V8', 'L_VMV1', 'L_VMV2', 'L_VMV3', 'L_VVC',
          'L_FFC', 'L_FST', 'L_IPS1', 'L_LO1', 'L_LO2', 'L_LO3', 'L_MST', 'L_MT',
          'L_PH', 'L_PIT',
          'R_V1', 'R_V2', 'R_V3', 'R_V3A', 'R_V3B', 'R_V3CD', 'R_V4', 'R_V4t',
          'R_V6', 'R_V6A', 'R_V7', 'R_V8', 'R_VMV1', 'R_VMV2', 'R_VMV3', 'R_VVC',
          'R_FFC', 'R_FST', 'R_IPS1', 'R_LO1', 'R_LO2', 'R_LO3', 'R_MST', 'R_MT',
          'R_PH', 'R_PIT'
        ]
        example: ['L_V1', 'R_V1', 'L_V4', 'R_V4']
      
      voxel_index:
        type: numpy.ndarray
        description: |
          Binary one-hot encoded vector indicating which vertices to include.
          Must have exactly the same length as the number of available vertices (7,831).
          Each position set to 1 indicates that vertex should be included.
        example: [0, 0, ..., 1, 1, 0]

  stimulus:
    type: numpy.ndarray
    required: true
    shape: [batch_size, 3, height, width]
    description: "A batch of RGB images to be encoded. Images should be in integer format with values in the range [0, 255], and square dimensions (e.g. 224×224)."
    example: "An array of shape [100, 3, 224, 224] representing 100 RGB images."
    function: "encode"

  device:
    type: str
    required: false
    valid_values: ["cpu", "cuda", "auto"]
    default: "auto"
    example: "auto"
    description: "Device to run the model on. 'auto' will use CUDA if available, otherwise CPU."
    function: "encode"
  
  show_progress:
    type: bool
    required: false
    default: True
    example: True
    description: "Whether to show a progress bar during encoding (for large batches)."
    function: "encode"

