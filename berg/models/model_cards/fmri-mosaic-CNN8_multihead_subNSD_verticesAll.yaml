          Auditory: A1, A4, A5, LBelt, MBelt, PBelt, RI, TA2
          
          Association & Higher-Order: 7AL, 7Am, 7PC, 7PL, 7Pm, 7m, 8Ad, 8Av, 8BL, 8BM, 8C,
