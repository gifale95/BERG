model_id: fmri-cneuromod_algo2025-text2fmri
modality: fMRI
training_dataset: CNeuroMod (Algonauts 2025 challenge preparation)
species: Human
stimuli: Text
model_type: Transformers
creator: Shrey Dixit

# General description of the model
description: |
  Text2fMRI offers a suite of lightweight encoding models, available through the Hugging Face 
  collection 'ShreyDixit/Text2fMRI', designed to predict whole-brain fMRI responses 
  solely from video transcripts.
  
  Multiple configurations are available to suit different resource constraints. 
  The smallest and most lightweight configuration consists of approximately 52M 
  trainable parameters, leveraging a frozen 500M parameter LLM (Qwen-2.5-0.5B) 
  for feature extraction. 
  
  Trained on the CNeuroMods dataset (Friends and Movie10)—the same data used for 
  the Algonauts 2025 Challenge—this model generates in silico neural responses 
  without requiring visual or audio inputs. Despite its efficiency, even the 
  smallest model outperforms standard baselines and achieves near-SOTA performance 
  in auditory and language-selective cortices.


metadata: |
  NOTE: Metadata contains ROI masks for the Schaefer 1000-parcel 7-network atlas
  'roi_masks':
      cont                               : (1000,) - Binary mask for Control/Frontoparietal network parcels
      default                            : (1000,) - Binary mask for Default Mode network parcels
      dorsattn                           : (1000,) - Binary mask for Dorsal Attention network parcels
      limbic                             : (1000,) - Binary mask for Limbic network parcels
      salventattn                        : (1000,) - Binary mask for Salience/Ventral Attention network parcels
      sommot                             : (1000,) - Binary mask for Somatomotor network parcels
      vis                                : (1000,) - Binary mask for Visual network parcels

# Input stimulus information
input:
  type: "list[str]"
  description: |
    A list of strings where each string corresponds to the text spoken during a 
    single fMRI Time Repetition (TR).
  example: |
    ["Hello, are you", "awake? Yes,"]

# Output information
output:
  type: "torch.Tensor"
  shape: [num_timepoints, num_rois]
  description: "The predicted fMRI activity for the given stimulus."
  dimensions:
    - name: "num_timepoints"
      description: "Number of TRs (timepoints) in the input stimulus."
    - name: "num_rois"
      description: "Number of Regions of Interest (1000 parcels from Schaefer 2018 atlas)."

# Model parameters and their usage
parameters:

  model_id:
    description: Unique identifier of the model to load.
    required: true
    type: "str"
    valid_values: "fmri-cneuromod_algo2025-text2fmri"
    example: "fmri-cneuromod_algo2025-text2fmri"
    function: "get_encoding_model, get_model_metadata"

  subject:
    type: int
    required: true
    valid_values: [1, 2, 3, 5] # Adjust based on your config.num_subjects
    description: "The ID of the subject to generate predictions for."
    example: 1
    function: "get_encoding_model, get_model_metadata"

  device:
    type: str
    required: false
    default: "auto"
    valid_values: ["cpu", "cuda", "auto"]
    description: "The computing device to use for inference."
    example: "auto"
    function: "get_encoding_model"

  selection:
    type: dict
    required: false
    description: |
      Optional filter to restrict the output to specific brain networks.
    function: get_encoding_model
    properties:
      roi:
        type: list[str]
        description: "Filter output by Schaefer 2018 (7-network) atlas labels."
        valid_values: ['Vis', 'SomMot', 'DorsAttn', 'SalVentAttn', 'Limbic', 'Cont', 'Default']
        example: ['Vis']
      voxel_index:
        type: numpy.ndarray
        description: |
          Binary one-hot encoded vector indicating which voxels to include.
          Must have exactly the same length as the number of available voxels (1000).
          Each position set to 1 indicates that voxel should be included.
        example: [0, 0, ..., 1, 1, 0]

  model:
    description: An instantiated and loaded encoding model.
    required: true
    type: BaseModelInterface
    function: "encode"

  stimulus:
    type: "list[str]"
    required: true
    description: |
      A list of strings where each string corresponds to the text spoken during a 
      single fMRI Time Repetition (TR).
    example: |
      ["Hello, are you", "awake? Yes,"]
    function: "encode"

  low_mem_use:
    type: bool
    required: false
    default: false
    description: |
      If True, sequentially loads/unloads the Feature Extractor and the Encoding Model 
      to minimize VRAM usage, at the cost of slower execution.
    example: true
    function: "encode"

  return_metadata:
    description: "Whether to return the encoding model's metadata together with the in silico neural responses."
    required: false
    type: bool
    default: false
    example: true
    function: "encode"

  show_progress:
    description: "Whether to show a progress bar during encoding (for large batches)."
    required: false
    type: bool
    default: true
    example: true
    function: "encode"

# Performance metrics
performance:
  metrics:
    - name: "Performance Metrics"
      value: "Available in Hugging Face Collection: ShreyDixit/text2fmri"

# References
references:
  - Course Materials: "Dixit, S. (2026). Text2fMRI: Brain Encoding Models using LLMs (Course Materials) (v0.1.2). Zenodo. https://doi.org/10.5281/zenodo.18369862"
  - Huggingface Collection: https://huggingface.co/ShreyDixit/Text2fMRI-Qwen-2.5-0.5B
