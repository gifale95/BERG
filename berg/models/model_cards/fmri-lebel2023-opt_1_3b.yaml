# Basic metadata
model_id: fmri-lebel2023-opt_1_3b
modality: fMRI
training_dataset: LeBel et al. (2023) — extended dataset
species: Human
stimuli: Text (spoken narrative stories with word onset times)
model_type: OPT-1.3B–based linear encoding model (contextual LLM embeddings + ridge regression)
creator: Domenic Bersch

# General description of the model
description: |
  This encoding model predicts voxelwise BOLD fMRI responses from natural language
  input using contextual embeddings from OPT-1.3B (layer 18) mapped to brain
  activity via voxelwise ridge regression, following the scaling-laws approach of
  Antonello, Vaidya & Huth (NeurIPS 2023).

  **Neural data.** The model was trained on the extended LeBel et al. (2023) dataset,
  in which 3 participants (UTS01, UTS02, UTS03) passively listened to approximately
  95 complete narrative stories (~20 hours each) from The Moth and Modern Love
  podcasts over 15 fMRI scanning sessions. Functional data were acquired at 3T
  (TR=2s, 2.6mm isotropic) and preprocessed with motion correction, cross-run
  alignment, Savitzky-Golay detrending, and z-scoring. The number of cortical
  voxels varies per subject (approximately 80,000–96,000).

  **Feature extraction.** Each word in the input is processed through OPT-1.3B
  (Zhang et al., 2022), a 1.3-billion-parameter decoder-only transformer language
  model. The hidden state at the last BPE token of each word is extracted from
  layer 18 (of 24 total layers), yielding a 2,048-dimensional contextual embedding
  per word. A dynamic context window is used for computational efficiency: the
  context grows word-by-word until 512 words, then resets to 256 words
  (Antonello et al., 2023, Section 2.3). Unlike static embeddings (e.g.,
  English1000), these contextual features capture word order, syntax, and
  discourse-level meaning.

  **Temporal processing.** The model requires word onset times as input, since the
  temporal structure of the stimulus is essential for accurate predictions (a
  fixed-rate approximation degrades voxelwise correlation from r≈0.99 to r≈0.33).
  The temporal pipeline is:

    1. **Lanczos downsampling.** Word-level feature vectors (2,048-dim impulses at
       each word onset) are low-pass filtered and resampled to the fMRI acquisition
       rate (TR=2s) using a Lanczos filter with a 3-lobe window. This converts
       discrete word events into a continuous feature time series aligned to the
       fMRI sampling grid.

    2. **Z-scoring.** The downsampled features are standardised (zero mean, unit
       variance) across time for each feature dimension.

    3. **Finite Impulse Response (FIR) delays.** To model the hemodynamic response
       delay, the features are concatenated with copies delayed by 1, 2, 3, and
       4 TRs (2, 4, 6, and 8 seconds). This expands the feature vector from
       2,048 to 8,192 dimensions at each TR.

    4. **Prediction.** The delayed feature matrix is multiplied by the pre-trained
       ridge regression weights to produce predicted BOLD responses at each TR.

  **Training.** Approximately 95 stories were used for training (~20 hours of
  speech per subject) with ridge regression fitted independently per voxel. The
  ridge regularisation parameter was selected per voxel via bootstrap
  cross-validation. Regularisation alphas were drawn from logspace(1, 4, 15).
  Three test stories (including "Where There's Smoke" with 10 repeats) were used
  for evaluation. Training features were trimmed by 10 TRs from the start and
  5 TRs from the end; test features were trimmed by 50 TRs from the start
  (to exclude long-context artifacts, Antonello et al. Section 3.5) and 5 TRs
  from the end.

  **Noise ceiling.** Computed using the Schoppe et al. (2016) signal/noise power
  decomposition on 10 repeated presentations of the test story, with CCmax
  floored at 0.25 to regularise noisy voxels (Antonello et al., Section 2.5).

  **Output.** The model returns a 2D array of predicted BOLD responses at each TR,
  across all cortical voxels (or a user-specified subset via ROI selection).
  Responses are in z-scored units consistent with the training data preprocessing.


metadata: |
  'fmri':
      subject_id                 : str         - Subject identifier (e.g., 'UTS01')
      n_voxels                   : int         - Total number of cortical voxels (varies per subject, see below)
      tr                         : float       - Repetition time in seconds (2.0)
      voxel_size_mm              : float       - Isotropic voxel size in mm (2.6)
  'encoding_model':
      train_stories              : array       - Story names used for model training (~95 stories)
      test_stories               : array       - Story names used for model testing
      correlation                : (n_voxels,) - Voxelwise prediction accuracy (Pearson's r) on test story
      cc_norm                    : (n_voxels,) - Noise-ceiling-normalised correlation (CCabs / CCmax)
      noise_ceiling              : (n_voxels,) - Voxelwise noise ceiling CCmax (Schoppe et al., floored at 0.25)
  'roi':
      Not all ROIs are available for every subject. ROIs are derived from
      hand-drawn functional localizer data. Use get_model_metadata() to check
      which ROIs are available for a given subject. Each ROI is a boolean mask
      of shape (n_voxels,) where True indicates membership.
      Common ROIs across most subjects include: AC, EBA, FFA, M1F, M1H, M1M,
      PPA, RSC, S1F, S1H, S1M, SMFA, SMHA, sPMv.
      See the 'roi' selection parameter below for the full list of possible ROIs.


# Input stimulus information
input:
  type: "dict"
  description: |
    A dictionary with two required keys:

      ``words``   — list of str: the words of the stimulus in order.
      ``word_onsets`` — list of float or numpy.ndarray: the onset time of each
                        word in seconds (relative to an arbitrary t=0).

    Both lists must have the same length. The word onset times are critical for
    accurate predictions because the model's temporal pipeline (Lanczos
    downsampling + FIR delays) depends on the precise timing of each word.
    Using a fixed-rate approximation instead of real word onsets degrades
    voxelwise correlation from r≈0.99 to r≈0.33.

    The model was trained on naturalistic spoken English narrative stories.
    For best results, use natural English text with realistic inter-word timing.

    **Note on TR times.** The output TRs are automatically generated from the
    word onset times using the fMRI acquisition rate (TR=2s). The first output
    TR starts at the onset of the first word, and TRs continue at 2-second
    intervals until the last word.
  example: |
    {
        "words": ["I", "reached", "over", "and", "slowly", "undid", "my", "seatbelt"],
        "word_onsets": [0.0, 0.3, 0.6, 0.85, 1.1, 1.5, 1.8, 2.0]
    }

# Output information
output:
  type: "numpy.ndarray"
  shape: "(n_TRs, n_voxels)"
  description: |
    The output is a 2D array containing predicted z-scored BOLD fMRI responses.
    Each row corresponds to one fMRI volume (TR=2s), each column to one cortical
    voxel (or a subset if ROI selection is applied). The number of output TRs is
    determined by the duration of the input stimulus.
  dimensions:
    - name: "n_TRs"
      description: "Number of fMRI volumes (determined by stimulus duration and TR=2s)."
    - name: "n_voxels"
      description: "Number of selected voxels for which in silico fMRI responses are generated."


# Model parameters and their usage
parameters:

  model_id:
    description: Unique identifier of the model to load.
    required: true
    type: "str"
    valid_values: "fmri-lebel2023-opt_1_3b"
    example: "fmri-lebel2023-opt_1_3b"
    function: "get_encoding_model, get_model_metadata"

  subject:
    description: |
      Subject ID from the LeBel et al. (2023) extended dataset.
      Only subjects UTS01, UTS02, and UTS03 are available, as only these
      subjects have the extended dataset (~20 hours) required to train
      encoding models with high-dimensional contextual features.
    required: true
    type: str
    valid_values: ["UTS01", "UTS02", "UTS03"]
    example: "UTS03"
    function: "get_encoding_model, get_model_metadata"

  selection:
    description: |
      Specifies which voxels to include in the model responses.
      If not provided, responses are generated for all cortical voxels.

      **Important:** Not all ROIs are available for every subject. ROIs are
      derived from hand-drawn functional localizer data and vary across
      subjects. If a requested ROI is not available for the selected subject,
      an error is raised listing the available ROIs. Use get_model_metadata()
      to inspect which ROIs exist for a given subject.
    required: false
    type: dict
    function: get_encoding_model
    properties:
      roi:
        type: list[str]
        description: |
          List of ROI names for which in silico fMRI responses are generated.
          ROIs are defined per subject from functional localizer data. Not all
          ROIs are available for every subject — use get_model_metadata() to
          check availability.
        valid_values: ['AC', 'ATFP', 'Broca', 'Brocas', 'EBA', 'FBA', 'FEF', 'FFA',
                      'FO', 'IFSFP', 'IPS', 'IPS ', 'ISPS', 'LO', 'M1F', 'M1H', 'M1M', 'OFA', 'OPA',
                      'PMvh', 'PPA', 'RSC', 'S1F', 'S1H', 'S1M', 'S2F', 'S2H', 'S2M', 'SEF', 'SMFA',
                      'SMHA', 'TOS', 'V1', 'V2', 'V3', 'V3A', 'V3B', 'V4', 'V7', 'VO', 'hMT', 'pSTS', 'sPMv']
        example: ["AC", "Broca"]
      voxel_index:
        type: numpy.ndarray
        description: |
          Binary one-hot encoded vector with ones indicating the voxels for
          which in silico fMRI responses are generated. This vector must have
          exactly the same length as the number of voxels for the selected
          subject:
          - UTS01:  81,126 voxels
          - UTS02:  94,251 voxels
          - UTS03:  95,556 voxels
          The voxels from the one-hot encoded vector are included in addition to
          any voxels selected via the "roi" key. If both are provided, the union
          of all selected voxels is used.
        example: [0, 0, ..., 1, 1, 0]

  device:
    description: |
      Device to run the model on. OPT-1.3B requires approximately 3 GB of VRAM
      in float16 (GPU) or approximately 5 GB of RAM in float32 (CPU). Using
      'auto' will select CUDA if available, otherwise CPU. GPU inference is
      recommended for faster feature extraction.
    required: false
    type: str
    valid_values: ["cpu", "cuda", "auto"]
    example: "auto"
    default: "auto"
    function: "get_encoding_model"

  model:
    description: An instantiated and loaded encoding model.
    required: true
    type: BaseModelInterface
    function: "encode"

  stimulus:
    description: |
      A dictionary containing the words and their onset times:
        - "words": list of str — the words of the stimulus in presentation order.
        - "word_onsets": list of float — onset time of each word in seconds.
      Both lists must have the same length.
    required: true
    type: dict
    example: |
      {
          "words": ["I", "reached", "over", "and", "slowly", "undid", "my", "seatbelt"],
          "word_onsets": [0.0, 0.3, 0.6, 0.85, 1.1, 1.5, 1.8, 2.0]
      }
    function: "encode"

  return_metadata:
    description: "Whether to return the encoding model's metadata together with the in silico neural responses."
    required: false
    type: bool
    default: false
    example: true
    function: "encode"

  show_progress:
    description: "Whether to show a progress bar during encoding."
    required: false
    type: bool
    default: true
    example: true
    function: "encode"

