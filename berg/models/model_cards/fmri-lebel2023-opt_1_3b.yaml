# Basic metadata
model_id: fmri-lebel2023-opt_1_3b
modality: fMRI
training_dataset: LeBel et al. (2023)
species: Human
stimuli: Text (spoken narrative stories)
model_type: OPT-1.3B–based linear encoding model (LLM embeddings + ridge regression)
creator: Domenic Bersch

# General description of the model
description: |
  This encoding model predicts voxelwise BOLD fMRI responses from natural language
  input using English1000 semantic word embeddings mapped to brain activity via
  ridge regression.

  **Neural data.** The model was trained on the LeBel et al. (2023) dataset, in which
  8 participants passively listened to 27 complete narrative stories (~6 hours) from
  The Moth podcast over 5 fMRI scanning sessions. Functional data were acquired at
  3T (TR=2s, 2.6mm isotropic) and preprocessed with motion correction, cross-run
  alignment, detrending, and z-scoring. The preprocessed data are projected onto
  hand-corrected cortical surfaces. The number of cortical voxels varies per subject
  (approximately 80,000–110,000).

  **Feature extraction.** Each word in the input is mapped to a 985-dimensional vector
  from the English1000 word embedding space, a co-occurrence-based semantic model
  (Huth et al., 2016, Nature). Words not found in the vocabulary are assigned a
  zero vector.

  **Temporal processing.** The model was trained on continuous naturalistic speech,
  not isolated sentences. To enable a simple "sentences in → responses out"
  interface, the model internally simulates temporal processing as follows:

    1. **Word timing.** Each word is assigned an onset time assuming a fixed
       presentation rate of 3 words per second (close to the ~3.5 words/sec
       natural speech rate in the training data). Consecutive sentences are
       separated by a 3-second pause.

    2. **Lanczos downsampling.** The word-level feature vectors (985-dim Dirac
       impulses at each word onset) are low-pass filtered and resampled to the
       fMRI acquisition rate (TR=2s) using a Lanczos filter with a 3-lobe window.
       This converts discrete word events into a continuous feature time series.

    3. **Finite Impulse Response (FIR) delays.** To account for the hemodynamic
       response delay (~6s between neural activity and BOLD signal peak), the
       downsampled features are concatenated with copies delayed by 1, 2, 3, and
       4 TRs (2, 4, 6, and 8 seconds). This expands the feature vector from
       985 to 3,940 dimensions at each TR.

    4. **Prediction.** The delayed feature matrix is multiplied by the pre-trained
       ridge regression weights to produce predicted BOLD responses at each TR.
       The peak predicted response within each sentence's time window is returned
       as the output for that sentence.

  **Important approximation.** Because the model internally assigns word timings
  using a fixed rate, the temporal fine structure of real speech (pauses,
  emphasis, speaking rate variation) is not captured. The semantic content of
  the words is fully preserved. This approximation is suitable for comparing
  the predicted neural response to different sentences, but users should be
  aware that the model was originally designed for continuous narrative speech,
  not isolated sentences. The encoding model accuracy metrics in the metadata
  reflect performance on continuous stories, not on isolated sentences.

  **Training.** 26 stories were used for training (~320 minutes of speech) with
  ridge regression fitted independently per voxel. The ridge regularization
  parameter was selected per voxel via bootstrap cross-validation (50 bootstrap
  samples). One story ("Where There's Smoke") was repeated across all 5 sessions
  and used as the held-out test set.

  **Output.** For each input sentence, the model returns a vector of predicted
  BOLD responses across all cortical voxels (or a user-specified subset via ROI
  selection). The responses are in z-scored units, consistent with the
  preprocessing of the training data.


metadata: |
  'fmri':
      subject_id                 : str         - Subject identifier (e.g., 'UTS01')
      n_voxels                   : int         - Total number of cortical voxels (varies per subject, see below)
      train_stories              : (26,)       - Story names used for model training
      test_stories               : (1,)        - Story name used for model testing ('wheretheressmoke')
  'encoding_models':
      correlation                : (n_voxels,) - Voxelwise prediction accuracy (Pearson's r) on test story
      noise_ceiling              : (n_voxels,) - Voxelwise noise ceiling (regularized CCnorm, floored at 0.3)
  'roi':
      Not all ROIs are available for every subject. ROIs are derived from
      hand-drawn functional localizer data. Use get_model_metadata() to check
      which ROIs are available for a given subject. Each ROI is a boolean mask
      of shape (n_voxels,) where True indicates membership.
      Common ROIs across most subjects include: AC, EBA, FFA, M1F, M1H, M1M,
      PPA, RSC, S1F, S1H, S1M, SMFA, SMHA, sPMv.
      See the 'roi' selection parameter below for the full list of possible ROIs.


# Input stimulus information
input:
  type: "list[str] or numpy.ndarray"
  description: |
    List or array of natural language sentences to encode.

    The model was trained on naturalistic spoken English narrative stories from
    The Moth podcast. For best results, use complete English sentences with
    common vocabulary. Words not found in the English1000 vocabulary (~10,000
    words) are silently ignored (assigned zero vectors).

    The model internally assigns word timings at a fixed rate of 3 words per
    second. Sentences are separated by a 3-second pause. The temporal
    processing (Lanczos downsampling + FIR delays) is handled automatically.
  example: |
    ["I reached over and slowly undid my seatbelt",
     "The audience erupted into laughter and applause"]

# Output information
output:
  type: "numpy.ndarray"
  shape: "(n_sentences, n_voxels)"
  description: |
    The output is a 2D array containing predicted z-scored BOLD fMRI responses.
    Each row corresponds to one input sentence, each column to one cortical voxel
    (or a subset if ROI selection is applied). The response for each sentence is
    the peak predicted BOLD within that sentence's temporal window, accounting for
    the hemodynamic delay.
  dimensions:
    - name: "n_sentences"
      description: "Number of input sentences."
    - name: "n_voxels"
      description: "Number of selected voxels for which in silico fMRI responses are generated."


# Model parameters and their usage
parameters:

  model_id:
    description: Unique identifier of the model to load.
    required: true
    type: "str"
    valid_values: "fmri-lebel-eng1000"
    example: "fmri-lebel-eng1000"
    function: "get_encoding_model, get_model_metadata"

  subject:
    description: "Subject ID from the LeBel et al. (2023) dataset."
    required: true
    type: str
    valid_values: ["UTS01", "UTS02", "UTS03", "UTS04", "UTS05", "UTS06", "UTS07", "UTS08"]
    example: "UTS01"
    function: "get_encoding_model, get_model_metadata"

  selection:
    description: |
      Specifies which voxels to include in the model responses.
      If not provided, responses are generated for all cortical voxels.

      **Important:** Not all ROIs are available for every subject. ROIs are
      derived from hand-drawn functional localizer data and vary across
      subjects. If a requested ROI is not available for the selected subject,
      an error is raised listing the available ROIs. Use get_model_metadata()
      to inspect which ROIs exist for a given subject.
    required: false
    type: dict
    function: get_encoding_model
    properties:
      roi:
        type: list[str]
        description: |
          List of ROI names for which in silico fMRI responses are generated.
          ROIs are defined per subject from functional localizer data. Not all
          ROIs are available for every subject — use get_model_metadata() to
          check availability. If a requested ROI does not exist for the selected
          subject, an error will be raised listing the available ROIs.
        valid_values: ['AC', 'ATFP', 'Broca', 'Brocas', 'EBA', 'FBA', 'FEF', 'FFA', 
                      'FO', 'IFSFP', 'IPS', 'IPS ', 'ISPS', 'LO', 'M1F', 'M1H', 'M1M', 'OFA', 'OPA', 
                      'PMvh', 'PPA', 'RSC', 'S1F', 'S1H', 'S1M', 'S2F', 'S2H', 'S2M', 'SEF', 'SMFA', 
                      'SMHA', 'TOS', 'V1', 'V2', 'V3', 'V3A', 'V3B', 'V4', 'V7', 'VO', 'hMT', 'pSTS', 'sPMv']
        example: ["AC", "Broca"]
      voxel_index:
        type: numpy.ndarray
        description: |
          Binary one-hot encoded vector with ones indicating the voxels for
          which in silico fMRI responses are generated. This vector must have
          exactly the same length as the number of voxels for the selected
          subject:
          - UTS01:  81,126 voxels
          - UTS02:  94,251 voxels
          - UTS03:  95,556 voxels
          - UTS04: 109,469 voxels
          - UTS05:  99,322 voxels
          - UTS06:  92,198 voxels
          - UTS07:  94,395 voxels
          - UTS08:  97,023 voxels
          The voxels from the one-hot encoded vector are included in addition to
          any voxels selected via the "roi" key. If both are provided, the union
          of all selected voxels is used.
        example: [0, 0, ..., 1, 1, 0]

  device:
    description: |
      Device parameter included for API consistency. This model uses NumPy
      matrix multiplication and always runs on CPU.
    required: false
    type: str
    valid_values: ["cpu", "cuda", "auto"]
    example: "cpu"
    default: "cpu"
    function: "get_encoding_model"

  model:
    description: An instantiated and loaded encoding model.
    required: true
    type: BaseModelInterface
    function: "encode"

  stimulus:
    description: |
      List or array of natural language sentences to encode.
      The model was trained on naturalistic spoken English stories. Use complete
      English sentences for best results. Words not in the English1000 vocabulary
      are silently ignored.
    required: true
    type: "list[str] or numpy.ndarray"
    example: |
      ["I reached over and slowly undid my seatbelt",
       "The audience erupted into laughter and applause"]
    function: "encode"

  return_metadata:
    description: "Whether to return the encoding model's metadata together with the in silico neural responses."
    required: false
    type: bool
    default: false
    example: true
    function: "encode"

  show_progress:
    description: "Whether to show a progress bar during encoding."
    required: false
    type: bool
    default: true
    example: true
    function: "encode"

