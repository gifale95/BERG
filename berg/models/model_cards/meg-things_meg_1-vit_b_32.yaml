model_id: meg-things_meg1-vit_b_32
modality: MEG
training_dataset:  THINGS MEG 1
species: Human
stimuli: Images
model_type: Vision transformer (ViT-B/32)
creator: Domenic Bersch

# General description of the model
description: |
  This encoding model consists of a linear mapping through linear regression of a vision transformer
  (Dosovitskiy et al., 2020) image features onto whole-brain magnetoencephalography (MEG) responses from the THINGS-data MEG dataset (Hebart et al., eLife 2023). The model provides features from all 12 transformer layers, using the full
  set of patch tokens per layer to represent each stimulus image. For each image stimulus, features are concatenated across all spatial tokens and reduced to 250 principal components via principal-component analysis (PCA). These reduced features serve as predictors for MEG responses.

  **Neural data.** MEG data were recorded from four human participants (P1–P4) viewing 1,854 object categories
  from the THINGS database (~22,000 naturalistic object images). Recordings were acquired with 271 sensors at
  200 Hz, epoched from −100 ms to +1300 ms relative to stimulus onset. The preprocessing pipeline included
  band-pass filtering (0.1–40 Hz), epoching, baseline correction (−100 to 0 ms), and exclusion of malfunctioning
  sensors.

  **Model training partition.** Single-trial responses to approximately 22,000 unique naturalistic images were
  used for training.

  **Model testing partition.** 200 test images, each repeated 12 times, were used for evaluation; the
  target responses correspond to the average MEG activity across repetitions.

  **Training procedure.** Independent linear regression models were fitted separately for each MEG sensor
  and time point, predicting the sensor’s time-resolved response from the feature vectors. The resulting model weights provide a spatiotemporal mapping from visual features to MEG sensor activity.

  **Noise ceiling.** The noise ceiling was computed from the 12 repeated presentations of each of the 200 test images 
  to quantify the maximum explainable variance given measurement noise. We calculated the signal-to-noise 
  ratio (ncsnr) by separating within-image variance (noise) from between-image variance (signal), then 
  converted to r² units: noise_ceiling = 100 × (ncsnr² / (ncsnr² + 1/12)). This represents the theoretical 
  upper bound of prediction accuracy for each sensor and time point.

  **Output.** Each trained model predicts time-resolved MEG responses for all 271 sensors (or user-specified
  subsets) across 281 time points (−100 to +1300 ms) for each input image.

metadata: |
  'meg':
      times                      : (281,)   - Time points (e.g., -0.1 to 1.3s relative to stimulus onset)
      subject_id                 : str      - Subject identifier
  'sensors:
      sensor_names               : (271,)   - MEG sensor name strings
      sensor_prefixes            : (271,)   - Sensor prefixes (e.g., 'MLF', 'MRC', 'MZO')
      sensor_hemispheres         : (271,)   - Hemisphere labels ('Left', 'Right', 'Midline')
      sensor_regions             : (271,)   - Region labels ('Frontal', 'Central', 'Parietal', 'Temporal', 'Occipital')
      n_sensors                  : int      - Number of MEG sensors (271)
  'encoding_model':
      train_img_ids              : (22248,) - THINGS image IDs for training (for ViT linking)
      train_concepts             : (22248,) - Object category IDs (1–1854)
      train_sessions             : (22248,) - Session numbers for training trials
      train_runs                 : (22248,) - Run numbers within each session
      train_img_files            : (22248,) - Full image paths on disk for training images
      test_things_img_ids        : (2400,)  - THINGS image IDs for test trials
      test_image_nr              : (2400,)  - Test image numbers (1–200, repeated over repetitions)
      test_concepts              : (2400,)  - Object category IDs for test trials
      test_sessions              : (2400,)  - Session numbers for test trials
      test_runs                  : (2400,)  - Run numbers for test trials
      test_img_files             : (2400,)  - Full image paths on disk for test images
      test_avg_things_img_ids    : (200,)   - Unique THINGS image IDs used in averaging
      test_avg_image_nr          : (200,)   - Test image numbers 1–200 (averaged over repetitions)
      test_avg_concepts          : (200,)   - Object category IDs for averaged test images
      test_avg_img_files         : (200,)   - Full image paths on disk for averaged test images
      ncsnr                      : (281, 271) - Neural cross-validated signal-to-noise ratio per time point and sensor
      noise_ceiling              : (281, 271) - Noise ceiling per time point and sensor


# Input stimulus information
input:
  type: "numpy.ndarray"
  shape: [batch_size, 3, height, width]
  description: "The input should be a batch of RGB images."
  constraints:
    - "Image values should be integers in range [0, 255]."
    - "Image dimensions (height, width) should be equal (square)."
    - "Minimum recommended image size: 224×224 pixels."

# Output information
output:
  type: "numpy.ndarray"
  shape: [batch_size, n_sensors, 281]
  description: "The output is a 3D array containing in silico MEG responses."
  dimensions:
    - name: "batch_size"
      description: "Number of stimuli in the batch."
    - name: "n_sensors"
      description: "Number of MEG sensors (up to 271, based on the number of sensors selected)."
    - name: "n_timepoints"
      description: "Number of time points in the MEG epoch (up to 281, based on the number of time points selected)."


# Model parameters and their usage
parameters:
  subject:
    type: str
    required: true
    valid_values: ["P1", "P2", "P3", "P4"]
    example: "P1"
    description: "Subject ID from the THINGS MEG1 dataset."
    function: "get_encoding_model"

  selection:
    type: dict
    description: |
      Specifies which outputs to include in the model responses.
      Can include specific senors and/or timepoints. If not provided,
      MEG responses are generated for all MEG sensors and time points.
    required: false
    function: get_encoding_model
    properties:
      region:
        type: list[str]
        description: |
          List of anatomical sensor-region labels to include. Each region
          groups multiple MEG sensors located over a specific cortical area:
            • Central — midline motor/somatosensory sensors  
            • Frontal — sensors over frontal cortex  
            • Occipital — sensors over visual cortex  
            • Parietal — sensors over parietal cortex  
            • Temporal — sensors over temporal lobes
          If multiple regions are listed, their sensors are concatenated.
        valid_values: ['Central', 'Frontal', 'Occipital', 'Parietal', 'Temporal']
        example: ['Central', 'Frontal', 'Occipital']
      sensors:
        type: list[str]
        description: |
          List of MEG sensor prefix codes to include. Each code identifies
          a cluster of planar gradiometers or magnetometers based on
          hemisphere (L = left, R = right, Z = midline) and cortical region:
            • MLC / MRC — Central (motor/somatosensory)
            • MLF / MRF — Frontal
            • MLO / MRO — Occipital (visual)
            • MLP / MRP — Parietal
            • MLT / MRT — Temporal
            • MZC / MZF / MZO / MZP — Midline (central, frontal, occipital, parietal)
          Sensors sharing a prefix (e.g., “MLF”) are typically grouped together
          for regional analyses or dimensionality reduction.
        valid_values: ['MLC', 'MLF', 'MLO', 'MLP', 'MLT', 'MRC', 'MRF', 'MRO', 'MRP',
                       'MRT', 'MZC', 'MZF',  'MZO', 'MZP']
        example: ['MLC', 'MLF', 'MLO']

      sensor_index:
        type: numpy.ndarray
        description: |
          Binary one-hot encoded vector indicating which sensors to include.
          Must have exactly the same length as the number of available sensors (271).
          Each position set to 1 indicates that sensor should be included.
        example: [0, 0, ..., 1, 1, 0]  
      timepoints:
        type: numpy.ndarray
        description: |
          Binary one-hot encoded vector indicating which timepoints to include.
          Length must equal the number of time samples (281). Each 1 indicates
          a selected timepoint.
        example: [0, 0, ..., 1, 1, 0]  

  stimulus:
    type: numpy.ndarray
    required: true
    shape: [batch_size, 3, height, width]
    description: "A batch of RGB images to be encoded. Images should be in integer format with values in the range [0, 255], and square dimensions (e.g. 224x224)."
    example: "An array of shape [100, 3, 224, 224] representing 100 RGB images."
    function: "encode"

  device:
    type: str
    required: false
    valid_values: ["cpu", "cuda", "auto"]
    default: "auto"
    example: "auto"
    description: "Device to run the model on. 'auto' will use CUDA if available, otherwise CPU."
    function: "encode"
  
  show_progress:
    type: bool
    required: false
    default: True
    example: True
    description: "Whether to show a progress bar during encoding (for large batches)."
    function: "encode"

