# Basic metadata
model_id: fmri-multi_study-tribe_v2
modality: fMRI
training_dataset: Multi-study naturalistic fMRI (CNeuroMod, BoldMoments, Lebel2023, Wen2017)
species: Human
stimuli: Video, Audio, Text
model_type: Multimodal Transformer (TRIBE v2)
creator: d'Ascoli, Rapin, Benchetrit, Brookes, Begany, Raugel, Banville, King (FAIR at Meta)

# General description of the model
description: |
  TRIBE v2 is a tri-modal (video, audio, and language) foundation model for predicting human fMRI
  brain activity. It uses frozen pretrained feature extractors — V-JEPA2-Giant (video), Wav2Vec-BERT-2.0
  (audio), and LLaMA-3.2-3B (text) — whose embeddings are fed into a trainable Transformer encoder that
  maps multimodal representations onto the cortical surface (fsaverage5, 20,484 vertices).

  **Architecture.** Stimulus features are extracted at 2 Hz from each modality, projected to a shared
  384-dimensional space per modality (1,152 total), and processed by an 8-layer, 8-head Transformer with
  100-second context windows. A subject-conditioned final layer maps latent representations to cortical
  vertices. For inference, the model uses a special "unseen subject" layer trained via subject dropout,
  producing group-average-like predictions without requiring subject-specific data.

  **Training data.** The model was trained on over 450 hours of fMRI across 25 subjects from four
  naturalistic datasets: Courtois NeuroMod (4 subjects, 269h — movies with speech), BoldMoments
  (10 subjects, 62h — short video clips), Lebel2023 (8 subjects, 86h — podcast listening), and
  Wen2017 (3 subjects, 35h — silent videos).

  **Feature extraction pipeline.** When given a video, the model automatically (1) extracts audio from
  the video track, (2) transcribes speech with WhisperX to get word-level timings, (3) extracts visual
  features from V-JEPA2-Giant (64 frames spanning 4 seconds per time bin), audio features from
  Wav2Vec-BERT-2.0, and text features from LLaMA-3.2-3B with 1,024 tokens of preceding context. When
  given text only, it first synthesizes speech via gTTS and then runs the same audio+text pipeline.

  **Output.** Predictions are time-resolved fMRI activity at 1 Hz (1 TR = 1 second) across 20,484
  cortical vertices on the fsaverage5 surface mesh. ROI selection is available via the Glasser
  HCP-MMP1.0 parcellation (180 bilateral cortical regions).

  **Performance.** TRIBE v2 achieved first place in the Algonauts 2025 brain prediction competition
  (263 teams). It significantly outperforms linear encoding baselines across all training datasets
  and generalizes zero-shot to unseen subjects and tasks, including non-naturalistic experimental
  paradigms such as visual and language functional localizers.

  **Setup requirements:**
  - GPU with at least 16 GB VRAM is recommended (runs V-JEPA2-Giant, LLaMA-3.2-3B, and
    Wav2Vec-BERT-2.0 for feature extraction).
  - HuggingFace account with access to the gated LLaMA-3.2-3B model
    (https://huggingface.co/meta-llama/Llama-3.2-3B). Request access, then authenticate:
    ``huggingface-cli login``
  - The tribev2 package must be installed:
    ``pip install tribev2 @ git+https://github.com/facebookresearch/tribev2.git``


metadata: |
    'fmri':
        subject_id           : str      - Subject identifier ('average')
        n_vertices           : int      - Total cortical vertices (20484)
        n_vertices_lh        : int      - Left hemisphere vertices (10242)
        n_vertices_rh        : int      - Right hemisphere vertices (10242)
        surface_mesh         : str      - Surface mesh name ('fsaverage5')
        output_frequency_hz  : float    - Temporal resolution of predictions (1.0 Hz)

    'roi':
        parcellation         : str      - Parcellation name ('Glasser_HCP-MMP1.0')
        roi_labels           : (180,)   - Bilateral ROI names (e.g., 'V1', 'V2', 'FFC')
        roi_assignments      : (20484,) - ROI index per vertex (-1 = medial wall)
        vertex_counts        : dict     - Number of vertices per ROI


# Input stimulus information
input:
  description: |
    The input should be a file path (string) to a video, audio, or text file.
    The file type is auto-detected from the extension.
  type: "str (file path)"
  supported_formats:
    video: [".mp4", ".avi", ".mkv", ".mov", ".webm"]
    audio: [".wav", ".mp3", ".flac", ".ogg"]
    text: [".txt"]
  constraints:
    - "Exactly one file path must be provided."
    - "For video files, audio is automatically extracted and speech is transcribed."
    - "For text files, text is synthesized to speech via gTTS, then processed."
    - "HuggingFace authentication is required for LLaMA-3.2-3B (run: huggingface-cli login)."
    - "GPU with >= 16 GB VRAM is recommended for feature extraction."

# Output information
output:
  description: |
    The output is a 2D array containing predicted fMRI activity on the fsaverage5
    cortical surface. Shape is (n_timesteps, n_vertices), where n_timesteps depends
    on stimulus duration (1 TR = 1 second) and n_vertices depends on ROI selection.

    With no selection: n_vertices = 20,484 (full cortex).
    With ROI selection: n_vertices = sum of vertices in selected ROIs.
    With vertex selection: n_vertices = number of selected vertices.
  type: "numpy.ndarray"
  shape: "[n_timesteps, n_vertices]"
  dimensions:
    - name: "n_timesteps"
      description: "Number of seconds of predicted brain activity (depends on stimulus duration)"
    - name: "n_vertices"
      description: "Number of cortical vertices in the selection (up to 20,484)"


# Model parameters and their usage
parameters:

  model_id:
    description: Unique identifier of the model to load.
    required: true
    type: "str"
    valid_values: "fmri-multi_study-tribe_v2"
    example: "fmri-multi_study-tribe_v2"
    function: "get_encoding_model, get_model_metadata"

  subject:
    description: |
      Subject identifier. TRIBE v2 uses a single 'unseen subject' layer that
      predicts group-average-like brain responses. Only 'average' is supported.
    required: false
    type: str
    valid_values: ["average"]
    default: "average"
    example: "average"
    function: "get_encoding_model, get_model_metadata"

  selection:
    description: |
      Specifies which cortical vertices to include in the model output.
      Can include ROI names and/or a binary vertex mask. If both are provided,
      their union (logical OR) is used. If not provided, all 20,484 vertices
      are returned.
    required: false
    type: dict
    function: get_encoding_model
    properties:
      roi:
        type: list[str]
        description: |
          List of Glasser HCP-MMP1.0 ROI names to include.
          Selects vertices from both hemispheres for each named region.
        valid_values: |
          180 bilateral Glasser ROI names. Common examples include:
          Visual (Early): V1, V2, V3, V4
          Visual (Ventral): VMV1, VMV2, VMV3, PHA1, PHA2, PHA3, FFC
          Visual (Dorsal): V3A, V6, V6A, V7, V3B, IPS1
          Visual (MT Complex): V3CD, V4t, LO1, LO2, LO3, MT, MST, FST
          Multisensory (TPJ): TPOJ1, TPOJ2, TPOJ3, STV, PSL
          Auditory (Association): A5, STSdp, STSvp, STSda, STSva, TA2
          Auditory (Early): RI, PBelt, MBelt, LBelt, A1, A4
          Inferior Frontal: 44, 45, IFSa, IFSp, IFJa, IFJp, PEF
          Default Mode: PGi, PGs, PFm, 10v, 10r, 10d, 10pp
          See metadata roi_labels for complete list.
        example: ["V1", "V2", "FFC"]
      vertices:
        type: numpy.ndarray
        description: |
          Binary one-hot encoded vector indicating which vertices to include.
          Must have exactly 20,484 elements (10,242 left + 10,242 right hemisphere).
          Each position set to 1 indicates that vertex should be included.
        example: "[0, 0, ..., 1, 1, 0]"

  device:
    description: |
      Device to run the model on. 'auto' will use CUDA if available, otherwise CPU.
      GPU is strongly recommended due to the heavy feature extraction pipeline
      (V-JEPA2-Giant, LLaMA-3.2-3B, Wav2Vec-BERT-2.0).
    required: false
    type: str
    valid_values: ["cpu", "cuda", "auto"]
    example: "auto"
    default: "auto"
    function: "get_encoding_model"

  model:
    description: An instantiated and loaded encoding model.
    required: true
    type: BaseModelInterface
    function: "encode"

  stimulus:
    description: |
      File path to the stimulus. Accepts video files (.mp4, .avi, .mkv, .mov, .webm),
      audio files (.wav, .mp3, .flac, .ogg), or text files (.txt). The file type is
      auto-detected from the extension.
    required: true
    type: str
    example: "'/path/to/video.mp4'"
    function: "encode"

  return_metadata:
    description: "Whether to return the encoding model's metadata together with the in silico neural responses."
    required: false
    type: bool
    default: false
    example: true
    function: "encode"

  show_progress:
    description: "Whether to show a progress bar during encoding."
    required: false
    type: bool
    default: true
    example: true
    function: "encode"


# Performance metrics and references
performance:
  description: |
    TRIBE v2 achieves state-of-the-art encoding performance across all training
    datasets and generalizes zero-shot to unseen subjects and paradigms. It placed
    first in the Algonauts 2025 competition (mean score 0.2146 ± 0.0312 across 4
    subjects) out of 263 teams. Encoding scores (Pearson R) range from ~0.1 in
    inferior frontal regions to ~0.35 in early visual cortex, with strongest
    performance for multimodal (video + audio + speech) stimuli.

references:
    - TRIBE v2 paper (d'Ascoli et al., 2026): https://ai.meta.com/research/publications/a-foundation-model-of-vision-audition-and-language-for-in-silico-neuroscience/
    - TRIBE v2 code: https://github.com/facebookresearch/tribev2
    - TRIBE v2 weights: https://huggingface.co/facebook/tribev2
    - TRIBE v2 demo: https://aidemos.atmeta.com/tribev2/
    - Glasser parcellation (Glasser et al., 2016): https://doi.org/10.1038/nature18933
    - Algonauts 2025 challenge (Gifford et al., 2024): https://arxiv.org/abs/2501.00504
