
# Basic metadata
model_id: fmri-tuckute_2024-GPT2_XL
modality: fMRI
training_dataset: Tuckute et. al (2024)
species: Human
stimuli: Text
model_type: GPT2-XL–based linear encoding model (LLM embeddings + ridge regression)
creator: Greta Tuckute

# General description of the model
description: |
  This encoding model predicts activity in the human left-hemisphere (LH) language network from 
  natural language input. It uses GPT2-XL representations mapped to fMRI BOLD responses via 
  linear ridge regression, enabling prediction and closed-loop control of language network activity.

  **Neural data.** Trained on fMRI data from five participants reading 1,000 diverse six-word sentences 
  in a rapid event-related design. The LH language network was defined per participant using a functional 
  localizer (top 10% language-responsive voxels across five parcels: IFGorb, IFG, MFG, AntTemp, PostTemp). 
  BOLD responses were averaged across voxels within each fROI, then averaged across participants and 
  z-scored session-wise. Target values are participant-averaged scalars (one per sentence per fROI).

  **Architecture.** Linear ridge regression model mapping GPT2-XL layer 22 last-token embeddings 
  (sentence-level representations) to predicted BOLD responses for six ROIs: lang_LH_AntTemp, lang_LH_IFG, 
  lang_LH_IFGorb, lang_LH_MFG, lang_LH_PostTemp, and lang_LH_netw (network average). Layer 22 was selected 
  via 5-fold cross-validation across all 48 GPT2-XL layers, achieving r ≈ 0.38 predictivity (noise ceiling 
  r ≈ 0.56).

  **Training.** Final model trained on all 1,000 sentences using GPT2-XL layer 22 embeddings. Ridge 
  regularization parameter selected via nested cross-validation. No fine-tuning of GPT2-XL performed. 
  Sentences preprocessed to six words with printable ASCII and standardized punctuation.

  **Evaluation.** Model tested on held-out baseline sentences, novel model-selected "drive" and "suppress" 
  sentences from external corpora, and new participants. Successfully demonstrated closed-loop control by 
  reliably modulating fMRI responses with model-selected sentences.

  **Output.** Six scalar values per sentence: z-scored, participant-averaged BOLD response magnitudes for 
  five language fROIs plus the network average, representing predicted engagement of each region and the 
  overall language system.




metadata: |
    'fmri':
        roi                  : (6,) 
    'encoding_model':
        noise_ceiling        : (N,)     - Noise Ceiling estimates per ROI
        
# Input stimulus information
input:
  type: "numpy.ndarray"
  shape: "[n_frames, height, width] or [n_batches, n_frames, height, width]"
  description: |
    The input should be a sequence of grayscale video frames, or a batch of video sequences.
    - Single video: shape [n_frames, height, width]
    - Batch of videos: shape [n_batches, n_frames, height, width]
  constraints:
    - "Frame values should be integers in range [0, 255]."

# Output information
output:
  type: "numpy.ndarray"
  shape: "[n_frames, n_neurons] or [n_batches, n_frames, n_neurons]"
  description: |
    The output is a 2D or 3D array containing in silico calcium imaging responses.
    - Single video: shape [n_frames, n_neurons]
    - Batch of videos: shape [n_batches, n_frames, n_neurons]
    
    The last dimension (n_neurons) corresponds to the number of neurons in the selected
    session/scan and ROI combination.
    
    Neuron counts vary by session and scan:

      - Session 4, Scan 7:  7,493 neurons

      - Session 5, Scan 6:  8,592 neurons

      - Session 5, Scan 7:  8,138 neurons

      - Session 6, Scan 2:  8,158 neurons

      - Session 6, Scan 4:  8,221 neurons

      - Session 6, Scan 6:  7,971 neurons

      - Session 6, Scan 7:  7,887 neurons

      - Session 7, Scan 3:  8,618 neurons

      - Session 7, Scan 5:  8,194 neurons

      - Session 8, Scan 5:  9,941 neurons

      - Session 9, Scan 3:  7,973 neurons

      - Session 9, Scan 4:  7,855 neurons
      
      - Session 9, Scan 6:  5,130 neurons

  dimensions:
    - name: "n_batches"
      description: "Number of batches chosen for inference"
    - name: "n_frames"
      description: "Number of video frames in the sequence"
    - name: "n_neurons"
      description: "Number of neurons in the selected session/scan and ROI"


# Model parameters and their usage
parameters:

  # Model ID
  model_id:
    description: Unique identifier of the model to load.
    required: true
    type: "str"
    valid_values: "calcium_2p-wang_2025-3DCNN"
    example: "calcium_2p-wang_2025-3DCNN"
    function: "get_encoding_model, get_model_metadata"

  # Session and scan selection
  train_session:
    type: str
    required: true
    valid_values: [
      "session-4_scan-7",
      "session-5_scan-6", 
      "session-5_scan-7",
      "session-6_scan-2",
      "session-6_scan-4",
      "session-6_scan-6",
      "session-6_scan-7",
      "session-7_scan-3",
      "session-7_scan-5",
      "session-8_scan-5",
      "session-9_scan-3",
      "session-9_scan-4",
      "session-9_scan-6"
    ]
    example: "session8_scan5"
    description: "Recording session and scan identifier in format 'session-X_scan-Y'"
    function: "get_encoding_model, get_model_metadata"

  # Selection parameter to define specific outputs (ROI, neurons, etc.)
  selection:
    type: dict
    description: |
      Specifies which outputs to include in the model responses.
      Can include specific brain areas and/or individual neurons. If not provided,
      calcium responses are generated for all neurons in the session/scan.
    required: false
    function: get_encoding_model
    properties:
      roi:
        type: list[str]
        description: List of brain areas to include in the output
        valid_values: ["AL", "LM", "RL", "V1"]
        example: ["V1", "LM"]
      field:
        type: list[int]
        description: Imaging Fields from the recording. Each Scan/Session has a different imaging fields available.
        valid_values: [1, 2, 3, 4, 5, 6, 7, 8]
        example: [1, 3]
      unit_index:
        type: numpy.ndarray
        description: |
          Binary one-hot encoded vector indicating which neurons to include.
          Must have exactly the same length as the total number of neurons in the
          selected session/scan (varies by session, e.g., 9,941 for session 8, scan 5).
          Each position set to 1 indicates that neuron should be included.
        example: [0, 0, ..., 1, 1, 0]

  device:
    type: str
    required: false
    valid_values: ["cpu", "cuda", "auto"]
    default: "auto"
    example: "auto"
    description: "Device to run the model on. 'auto' will use CUDA if available, otherwise CPU."
    function: "get_encoding_model"

  model:
    description: An instantiated and loaded encoding model.
    required: true
    type: BaseModelInterface
    function: "encode"

  stimulus:
    description:  |
      The input should be a sequence of grayscale video frames, or a batch of video sequences.
      - Single video: shape [n_frames, height, width]
      - Batch of videos: shape [n_batches, n_frames, height, width]
    required: true
    type: numpy.ndarray
    shape: 
      - [n_frames, height, width]
      - [n_batches, n_frames, height, width]
    example: "An array of shape [4, 100, 144, 256] representing 4 grayscale videos with 100 frames each."
    function: "encode"

  return_metadata:
    description: "Whether to return the encoding model's metadata together with the in silico neural resposnes."
    required: False
    type: bool
    default: Fale
    example: True
    function: "encode"

  show_progress:
    description: "Whether to show a progress bar during encoding (for large batches)."
    required: false
    type: bool
    default: True
    example: True
    function: "encode"


# Performance metrics and references
performance:
  
  accuracy_plots: 
    - "brain-encoding-response-generator/encoding_models/modality-calcium_2p/train_dataset-wang_2025/model-3DCNN/encoding_models_accuracy"


references:
    - Model repository: https://github.com/cajal/fnn
    - Model paper (Wang et al., Nature 2025): https://www.nature.com/articles/s41586-025-08829-y
