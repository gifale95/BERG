model_id: brainscore
modality: ephys
training_dataset: BrainScore
species: Macaque
stimuli: Images
model_type: BrainScore Vision Models (External)
creator: Martin Schrimpf

description: |
  This interface provides access to the BrainScore vision model ecosystem. BrainScore benchmarks neural network models against biological neural recordings from macaque visual cortex (V1, V2, V4, IT), offering 440+ pre-trained models with biologically-constrained representations.
  
  **Neural data.** BrainScore models are benchmarked against electrophysiological recordings from macaque visual cortex. Each model includes a region-to-layer mapping that specifies which network layer corresponds to which brain region (e.g., early layers → V1, late layers → IT).
  
  **Model architecture.** The interface supports diverse architectures and custom neurally-constrained models. Each model maps specific network layers to distinct brain regions based on benchmarking results.
  
  **Temporal dynamics.** Models provide time-binned responses representing neural activity within specified temporal windows (e.g., 70-170ms post-stimulus). Different time bins capture distinct processing stages: early feedforward processing (50-100ms), peak stimulus-evoked responses (70-170ms), and recurrent processing (100-200ms).
  
  **Accessing models.** Use `berg.list_models()` to see the interface entry, or `berg.list_models(expand_brainscore=True)` to list all 440+ available models. Individual models are accessed via `model_id = "brainscore-{model_name}"` (e.g., `"brainscore-vonegrcnn_47e"`).
  
  **External source.** Models are loaded on-demand from the BrainScore API. This is an external model source not hosted by BERG. For detailed model information and benchmarking scores, visit https://www.brain-score.org/


input:
  description: "Path to image directory or list of image file paths"
  type: "str or list[str]"
  constraints:
    - "Images must be readable image files (JPEG, PNG, etc.)"
    - "BrainScore handles preprocessing internally"

output:
  description: "Neural responses for specified recording target and time bins"
  type: "numpy.ndarray"
  shape: [batch_size, n_units]
  dimensions:
    - name: "batch_size"
      description: "Number of stimuli"
    - name: "n_units"
      description: "Number of neural units (varies by model and recording target)"

parameters:
  model_id:
    description: |
      Model identifier. Format: "brainscore-{model_name}"
      Example: "brainscore-vonegrcnn_47e"
      Use berg.list_models(expand_brainscore=True) to see all available models.
    required: true
    type: str
    example: "brainscore-vonegrcnn_47e"
    function: get_encoding_model

  selection:
    description: |
      Specifies recording target (brain region) and temporal windows.
      If not provided, responses are generated for all available brain regions.
    required: false
    type: dict
    function: get_encoding_model
    properties:
      roi:
        type: str
        description: |
          Brain region to record from. Each region corresponds to a specific network layer:
            • V1 (primary visual cortex): Early layers capturing low-level features (edges, orientations, spatial frequencies)
            • V2: Early-to-mid layers for intermediate feature processing
            • V4: Mid-level layers representing shapes, textures, and mid-level object features
            • IT (inferior temporal cortex): Late layers encoding high-level object representations and semantic categories

          When region is not specified, activations from all available regions are returned.
        valid_values: ["V1", "V2", "V4", "IT"]
        example: "V1"
      
      time_bins:
        type: list[tuple[int, int]]
        description: |
          Temporal windows for neural responses in milliseconds after stimulus onset.
          Each tuple specifies (start_ms, end_ms) for averaging neural activity within that window.
          
          **Default: [(70, 170)]** - Standard 100ms window capturing peak stimulus-evoked activity 
          in visual cortex, widely used in electrophysiology literature.
          
          **Temporal processing stages:**
          Early (50-100ms): Initial feedforward sweep through visual hierarchy, low-level feature extraction
          Peak (70-170ms): Maximum stimulus-driven responses, standard measurement window
          Late (100-200ms): Recurrent processing, feedback modulation, higher-level feature integration
          
          If not specified, defaults to [(70, 170)].
        example: [[100, 200]]

  device:
    description: "Device to run the model on"
    required: false
    type: str
    valid_values: ["cpu", "cuda", "auto"]
    default: "auto"
    function: get_encoding_model

  stimulus:
    description: |
      Path to directory containing images, or list of image file paths.
      
      Unlike BERG native models which accept numpy arrays, BrainScore models require 
      file paths to images. The interface handles conversion to BrainScore's internal 
      StimulusSet format automatically.
      
      Images should be standard formats (JPEG, PNG, etc.). BrainScore handles 
      preprocessing (resizing, normalization) internally based on each model's requirements.
    required: true
    type: "str or list[str]"
    example: "/path/to/images"
    function: "encode"

  show_progress:
    description: "Whether to show progress bar during encoding"
    required: false
    type: bool
    default: true
    function: "encode"

references:
  - BrainScore Website: https://www.brain-score.org/
  - BrainScore Vision Models Repository: https://github.com/brain-score/vision
  - BrainScore Paper (Schrimpf et al., 2018): https://www.biorxiv.org/content/10.1101/407007v1