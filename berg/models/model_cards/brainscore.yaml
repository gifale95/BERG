model_id: brainscore
modality: ephys
training_dataset: BrainScore
species: Macaque
stimuli: Images
model_type: BrainScore Vision Models (External)
creator: Martin Schrimpf

description: |
  This interface provides access to the BrainScore vision model ecosystem. BrainScore benchmarks neural network models against biological neural recordings from macaque visual cortex (V1, V2, V4, IT), offering 440+ pre-trained models with biologically-constrained representations.
  
  **Neural prediction workflow.** For each model and brain region combination, the interface:
  1. Loads the vision model (e.g., AlexNet, ResNet) pre-trained on ImageNet
  2. Loads benchmark neural recordings from the selected region (V1/V2/V4/IT)
  3. Trains a PLS regression mapping model activations → neural responses (~3 minutes, one-time)
  4. Caches the regression weights for fast subsequent predictions
  5. Uses the cached regression to predict neural responses for your images
  
  **Temporal dynamics.** Time bins are automatically set from the benchmark (typically 70-170ms post-stimulus for IT/V4, representing peak stimulus-evoked responses). This ensures consistency between regression training and prediction.
  
  **Model architecture.** The interface supports diverse architectures including standard CNNs, Vision Transformers, and custom neurally-constrained models. Each model maps specific network layers to brain regions based on benchmarking results.
  
  **Accessing models.** Use `berg.list_models()` to see the interface entry, or `berg.list_models(expand_brainscore=True)` to list all 440+ available models. Individual models are accessed via `model_id = "brainscore-{model_name}"` (e.g., `"brainscore-alexnet"`).
  
  **External source.** Models are loaded on-demand from the BrainScore API. Regression weights are cached locally in your BERG directory. For detailed model information and benchmarking scores, visit https://www.brain-score.org/


input:
  description: "Path to image directory or list of image file paths"
  type: "str or list[str]"
  constraints:
    - "Images must be readable image files (JPEG, PNG, etc.)"
    - "BrainScore handles preprocessing internally"

output:
  description: "Neural responses for specified recording target and time bins"
  type: "numpy.ndarray"
  shape: [batch_size, n_units]
  dimensions:
    - name: "batch_size"
      description: "Number of stimuli"
    - name: "n_units"
      description: "Number of neural units (varies by model and recording target)"

parameters:
  model_id:
    description: |
      Model identifier. Format: "brainscore-{model_name}"
      Example: "brainscore-vonegrcnn_47e"
      Use berg.list_models(expand_brainscore=True) to see all available models.
    required: true
    type: str
    example: "brainscore-vonegrcnn_47e"
    function: get_encoding_model

  selection:
    description: |
      Specifies recording target (brain region).
      ROI selection is REQUIRED for BrainScore models.
    required: true
    type: dict
    function: get_encoding_model
    properties:
      roi:
        type: str
        required: true
        description: |
          Brain region to record from (REQUIRED). Each region corresponds to a specific network layer:
            • V1 (primary visual cortex): Early layers capturing low-level features (edges, orientations, spatial frequencies)
            • V2: Early-to-mid layers for intermediate feature processing
            • V4: Mid-level layers representing shapes, textures, and mid-level object features
            • IT (inferior temporal cortex): Late layers encoding high-level object representations and semantic categories

          The model trains a PLS regression on benchmark neural data for the selected region.
          Regression weights are cached after first use for fast subsequent predictions.
          
          Time bins are automatically set from the benchmark (70-170ms for IT/V4, standard windows for V1/V2).
        valid_values: ["V1", "V2", "V4", "IT"]
        example: "IT"

  device:
    description: "Device to run the model on"
    required: false
    type: str
    valid_values: ["cpu", "cuda", "auto"]
    default: "auto"
    function: get_encoding_model

  stimulus:
    description: |
      Input stimuli for neural response prediction. Accepts multiple formats:
      
      1. Directory path (str): Path to directory containing images
         Example: "/path/to/images"
      
      2. List of paths (list[str]): List of image file paths
         Example: ["img1.jpg", "img2.jpg"]
      
      3. Numpy array (np.ndarray): Batch of RGB images
         Shape: (batch_size, 3, height, width)
         Values: [0, 255] (uint8)
         Example: np.array with shape (10, 3, 224, 224)
      
      For numpy arrays, images are temporarily saved to disk (BrainScore requirement)
      and automatically cleaned up after prediction.
      
      For file paths, images should be standard formats (JPEG, PNG, etc.).
      BrainScore handles preprocessing (resizing, normalization) internally.
    required: true
    type: "str, list[str], or np.ndarray"
    example: "/path/to/images"
    function: "encode"

  show_progress:
    description: "Whether to show progress bar during encoding"
    required: false
    type: bool
    default: true
    function: "encode"

references:
  - BrainScore Website: https://www.brain-score.org/
  - BrainScore Vision Models Repository: https://github.com/brain-score/vision
  - BrainScore Paper (Schrimpf et al., 2018): https://www.biorxiv.org/content/10.1101/407007v1