# Basic metadata
model_id: fmri-nsd_fsaverage-huze
modality: fMRI
training_dataset: Natural Scenes Dataset (NSD) (fsaverage surface space)
species: Human
stimuli: Images
model_type: Vision transformer (DINOv2)
creator: Huzheng Yang

# General description of the model
description: |
  The encoding model is based on a vision transformer (DINOv2) finetuned on LoRA. During training, the encoding model
  learned which DINOv2 layers and which spatial location of layer features to use to best predict each fMRI vertex.
  While this feature selection was learned for each vertex, nearby vertices were constrained to select similar features.
  Finally, the activity of each vertex is linearly predicted from the selected DINOv2 features.

  The encoding model training pipeline consisted of two steps. The goal of step 1 was to generate a noiseless version of
  fMRI responses, later used in step 2. This was achieved by training a single encoding model that predicted the fMRI
  responses of all 8 NSD subjects, by using as input the stimulus images, experimental design information (i.e., the
  stimulus presentation order), and behavioral data. This model was then used to generate in silico fMRI responses for
  all NSD images. In step 2 encoding models were trained, individually for each NSD subject, using as target data both
  the original fMRI responses of each subject and the in silico fMRI responses generated in step 1, and as input only
  the stimulus images.
  
  The encoding models were trained on the Natural Scenes Dataset (NSD) (Allen et al., 2022), 7T fMRI responses of 8
  subjects to 73k natural scenes coming from the COCO dataset (Lin et al., 2014).
  
  **Preprocessing.** The encoding models are trained on NSD's data prepared in FreeSurfer's fsaverage space, from the
  “betas_fithrf_GLMdenoise_RR” preprocessing version. Note that the NSD data were *z*-scored at each scan session, and as
  a consequence the in silico fMRI responses generated by the encoding models also live in *z*-scored space.

  **Model training partition.** fMRI responses for up to 9,000 non-shared images (i.e., the images uniquely seen by each
  subject during the NSD experiment).
  
  **Model validation partition.** fMRI responses for up to 485/1,000 shared images (i.e., the 485 shared images that not
  all subjects saw for up to three times during the NSD experiment).
  
  **Model testing partition.** fMRI responses for 515/1,000 shared images (i.e., the 515 images that each subject saw for
  exactly three times during the NSD experiment). The models are additionally tested out-of-distribution on NSD-synthetic,
  the out-of-distribution component of NSD consisting of fMRI responses from the same 8 NSD subjects to 286 NSD-synthetic
  images.

